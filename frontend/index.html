<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Knowledge Chatbot</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<canvas id="network"></canvas>

<div class="drop-overlay" id="dropOverlay">
  <div class="drop-overlay-inner">
    <span class="drop-overlay-icon">＋</span>
    <p>Release to index this file</p>
  </div>
</div>

<div id="authScreen" class="auth-screen">
  <div class="auth-box">
    <h2>Smart Knowledge Chatbot</h2>
    <p class="auth-subtitle">Sign in to continue</p>

    <div class="auth-tabs">
      <button id="tabLogin" class="auth-tab active">Login</button>
      <button id="tabSignup" class="auth-tab">Sign Up</button>
    </div>

    <form id="authForm">
      <input type="email" id="authEmail" placeholder="Email" autocomplete="email" required>
      <input type="password" id="authPassword" placeholder="Password" autocomplete="current-password" required>
      <button type="submit" id="authSubmitBtn">Login</button>
      <p id="authError" class="auth-error hidden"></p>
    </form>
  </div>
</div>
<div class="app-shell hidden sidebar-collapsed" id="appShell">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <button class="icon-btn" id="sidebarToggle" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>

      <button class="new-chat-btn" id="newChatBtn">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        New Chat
      </button>

      <button id="exportBtn" class="icon-btn" aria-label="Export chat" title="Export chat">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 20h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <button id="analyticsBtn" class="icon-btn" aria-label="View analytics" title="Analytics">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M4 20V10M12 20V4M20 20v-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="session-list" id="sessionList"></div>

    <button class="reset-row" id="resetBtn" title="Clear this chat's documents">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none"><path d="M4 4v6h6M20 20v-6h-6M4.5 15a8 8 0 0014.5 3.5M19.5 9A8 8 0 005 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Reset this chat
    </button>

    <button class="reset-row" id="logoutBtn" title="Logout">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Logout
    </button>
  </aside>

  <div class="main-panel">
    <header class="topbar">
      <div class="brand-center">
        <div class="brand-mark" id="brandMark">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="6" cy="6" r="2.2" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="18" cy="6" r="2.2" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="12" cy="18" r="2.2" stroke="currentColor" stroke-width="1.6"/>
            <path d="M7.8 7.3L10.5 16M16.2 7.3L13.5 16M8.2 6H15.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </div>

        <div class="brand-text">
          <div class="badge-row">
            <span class="tech-badge">RAG</span>
            <span class="tech-badge cyan">FAISS</span>
            <span class="tech-badge">CLIP</span>
            <span class="tech-badge cyan">Local LLM</span>
          </div>
          <h1>Smart Knowledge Chatbot</h1>
          <p id="docStatusText"><span class="status-dot" id="statusDot"></span><span class="mono">nothing indexed yet</span></p>
        </div>
      </div>
    </header>

    <main class="chat-area">
      <div class="chat-log" id="chatLog">
        <div class="msg msg-system">
          <p>Click the + below to upload a PDF or images — I'll figure out what your question is about.</p>
        </div>
      </div>

      <button class="scroll-down-btn hidden" id="scrollDownBtn" aria-label="Scroll to latest">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M12 5v14M5 12l7 7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </main>

    <div class="composer-wrap">
      <form class="composer" id="composerForm">
        <div class="composer-attachments hidden" id="composerAttachments"></div>
        <div class="composer-input-row">
          <div class="composer-upload-wrap">
            <button type="button" class="composer-upload" id="composerUpload" aria-label="Upload">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>

            <div class="upload-menu hidden" id="uploadMenu">
              <button type="button" data-type="doc">📄 Document(s)</button>
              <button type="button" data-type="image">🖼 Image(s)</button>
            </div>

            <input type="file" id="fileInputDoc" accept=".pdf,.docx,.txt" multiple hidden>
            <input type="file" id="fileInputImage" accept="image/*" multiple hidden>
          </div>

          <input
            type="text"
            id="questionInput"
            placeholder="Upload a document or image first…"
            autocomplete="off"
            disabled
          >

          <button type="submit" id="sendBtn" disabled aria-label="Send">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
              <path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </form>
    </div>
  </div>

</div>

<button class="icon-btn sidebar-open-btn" id="sidebarOpenBtn" aria-label="Open sidebar" title="Open sidebar">
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
</button>

<div id="analyticsModal" class="analytics-modal hidden">
  <div class="analytics-box">
    <div class="analytics-header">
      <h3>Chatbot Analytics</h3>
      <button id="closeAnalytics" class="icon-btn" aria-label="Close">✕</button>
    </div>
    <div id="analyticsContent" class="analytics-content">Loading…</div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
